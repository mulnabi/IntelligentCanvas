name: Deploy React

on:
  push:
    branches: [main]
  workflow_dispatch:

# ------ 추가-1 ------
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - uses: actions/configure-pages@v6
        id: pages

      - name: Build for GitHub Pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_GITHUB_PAGES: 'true'
          VITE_FIREBASE_MODE: production
          VITE_FIREBASE_ENABLE_PRODUCTION: ${{ vars.VITE_FIREBASE_ENABLE_PRODUCTION }}
          VITE_FIREBASE_APP_ORIGIN: ${{ steps.pages.outputs.origin }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_FUNCTIONS_REGION: ${{ vars.VITE_FIREBASE_FUNCTIONS_REGION }}
          VITE_FIREBASE_FUNCTIONS_BASE_URL: ${{ vars.VITE_FIREBASE_FUNCTIONS_BASE_URL }}
        run: |
          node --input-type=module -e "import { resolveFirebaseEnvironment } from './src/config/firebaseEnvironment.js'; try { resolveFirebaseEnvironment({ ...process.env, PROD: true }, process.env.VITE_FIREBASE_APP_ORIGIN) } catch (error) { console.error(error.message); process.exit(1) }"
          npm run build -- --base "${PAGES_BASE_PATH:-/}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
# ---------------------
